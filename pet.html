<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>추모관 - 별빛추모</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sky: { 50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7' }
          }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { background: linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 40%, #fefce8 100%); min-height: 100vh; }
  </style>
</head>
<body class="font-sans text-slate-700" x-data="petPage()" x-init="init()" x-cloak>

  <header class="bg-white/80 backdrop-blur-md border-b border-sky-100 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="text-2xl">✨</span>
        <span class="text-xl font-bold text-sky-600">별빛추모</span>
      </a>
      <div class="flex items-center gap-3">
        <template x-if="user && isOwner">
          <a :href="`create-pet.html?id=${petId}`" class="text-sm bg-sky-100 text-sky-700 px-3 py-1.5 rounded-full hover:bg-sky-200 transition">
            관리하기
          </a>
        </template>
        <template x-if="user">
          <button @click="logout" class="text-sm text-slate-500 hover:text-slate-700">로그아웃</button>
        </template>
        <template x-if="!user">
          <button @click="login" class="text-sm bg-sky-500 text-white px-3 py-1.5 rounded-full">로그인</button>
        </template>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8" x-show="!loading">
    
    <section class="bg-white rounded-3xl shadow-sm border border-sky-50 overflow-hidden mb-8">
      <div class="aspect-[16/9] sm:aspect-[21/9] bg-sky-50 relative">
        <img 
          :src="pet.coverUrl || 'https://placehold.co/800x400/e0f2fe/0ea5e9?text=✨'" 
          :alt="pet.name"
          class="w-full h-full object-cover"
        >
      </div>
      <div class="p-6 sm:p-8">
        <h1 class="text-3xl font-bold text-sky-800 mb-2" x-text="pet.name"></h1>
        <div class="flex flex-wrap gap-3 text-sm text-slate-500 mb-4">
          <span x-show="pet.breed" x-text="pet.breed"></span>
          <span x-show="pet.born_on">🎂 <span x-text="formatDate(pet.born_on)"></span></span>
          <span x-show="pet.passed_on">🌟 <span x-text="formatDate(pet.passed_on)"></span></span>
        </div>
        <p class="text-slate-600 leading-relaxed whitespace-pre-line" x-text="pet.story || '소개글이 없습니다.'"></p>
      </div>
    </section>

    <section class="mb-10">
      <h2 class="text-xl font-bold text-sky-700 mb-4 flex items-center gap-2">
        <span>📷</span> 추억 갤러리
        <span class="text-sm font-normal text-slate-400" x-text="`(${mediaList.length})`"></span>
      </h2>
      
      <div x-show="mediaList.length === 0" class="text-center py-10 text-slate-400 bg-white rounded-2xl border border-sky-50">
        아직 등록된 사진/영상이 없습니다.
      </div>
      
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <template x-for="media in mediaList" :key="media.id">
          <div class="aspect-square bg-sky-50 rounded-xl overflow-hidden relative group">
            <template x-if="media.media_type === 'image'">
              <img :src="media.url" :alt="media.file_name" class="w-full h-full object-cover">
            </template>
            <template x-if="media.media_type === 'video'">
              <video :src="media.url" class="w-full h-full object-cover" controls></video>
            </template>
          </div>
        </template>
      </div>
    </section>

    <section class="mb-10">
      <h2 class="text-xl font-bold text-sky-700 mb-4 flex items-center gap-2">
        <span>💌</span> 방명록
        <span class="text-sm font-normal text-slate-400" x-text="`(${guestbook.length})`"></span>
      </h2>

      <div x-show="user" class="bg-white rounded-2xl border border-sky-50 p-5 mb-6">
        <textarea 
          x-model="newMessage"
          rows="3"
          placeholder="따뜻한 마음을 남겨주세요..."
          class="w-full px-4 py-3 rounded-xl border border-sky-100 focus:outline-none focus:ring-2 focus:ring-sky-300 resize-none text-sm"
        ></textarea>
        <div class="flex justify-end mt-3">
          <button 
            @click="submitGuestbook"
            :disabled="!newMessage.trim() || submitting"
            class="bg-sky-500 text-white px-5 py-2 rounded-full text-sm hover:bg-sky-600 transition disabled:opacity-50"
          >
            <span x-text="submitting ? '등록 중...' : '방명록 남기기'"></span>
          </button>
        </div>
      </div>
      
      <div x-show="!user" class="bg-sky-50 rounded-2xl p-5 mb-6 text-center text-sm text-slate-500">
        방명록을 남기려면 <button @click="login" class="text-sky-600 font-medium hover:underline">로그인</button>이 필요합니다.
      </div>

      <div class="space-y-4">
        <template x-if="guestbook.length === 0">
          <div class="text-center py-8 text-slate-400 bg-white rounded-2xl border border-sky-50">
            아직 방명록이 없습니다. 첫 번째 마음을 남겨보세요.
          </div>
        </template>
        
        <template x-for="entry in guestbook" :key="entry.id">
          <div class="bg-white rounded-2xl border border-sky-50 p-5">
            <div class="flex justify-between items-start mb-2">
              <div>
                <span class="font-medium text-slate-800" x-text="entry.author_name"></span>
                <span class="text-xs text-slate-400 ml-2" x-text="formatDateTime(entry.created_at)"></span>
              </div>
              <button 
                x-show="isOwner"
                @click="deleteGuestbook(entry.id)"
                class="text-xs text-red-400 hover:text-red-600"
              >
                삭제
              </button>
            </div>
            <p class="text-slate-600 text-sm whitespace-pre-line" x-text="entry.message"></p>
          </div>
        </template>
      </div>
    </section>
  </main>

  <div x-show="loading" class="text-center py-20 text-slate-400">
    불러오는 중...
  </div>

  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script>
    function petPage() {
      return {
        petId: null,
        pet: {},
        mediaList: [],
        guestbook: [],
        user: null,
        profile: null,
        isOwner: false,
        loading: true,
        newMessage: '',
        submitting: false,

        async init() {
          const params = new URLSearchParams(window.location.search);
          this.petId = params.get('id');
          if (!this.petId) {
            window.location.href = 'index.html';
            return;
          }

          this.user = await getCurrentUser();
          if (this.user) {
            this.profile = await getOrCreateProfile(this.user);
          }

          await Promise.all([
            this.loadPet(),
            this.loadMedia(),
            this.loadGuestbook()
          ]);
          this.loading = false;
        },

        async loadPet() {
          const { data, error } = await supabase
            .from('pets')
            .select('*')
            .eq('id', this.petId)
            .single();

          if (error || !data) {
            alert('추모관을 찾을 수 없습니다.');
            window.location.href = 'index.html';
            return;
          }

          this.pet = {
            ...data,
            coverUrl: data.cover_path ? getPublicUrl(data.cover_path) : null
          };
          this.isOwner = this.user && this.user.id === data.owner_id;
          document.title = `${data.name} - 별빛추모`;
        },

        async loadMedia() {
          const { data, error } = await supabase
            .from('pet_media')
            .select('*')
            .eq('pet_id', this.petId)
            .order('sort_order', { ascending: true })
            .order('created_at', { ascending: true });

          if (!error && data) {
            this.mediaList = data.map(m => ({
              ...m,
              url: getPublicUrl(m.storage_path)
            }));
          }
        },

        async loadGuestbook() {
          const { data, error } = await supabase
            .from('guestbook_entries')
            .select('*')
            .eq('pet_id', this.petId)
            .order('created_at', { ascending: false });

          if (!error && data) {
            this.guestbook = data;
          }
        },

        async submitGuestbook() {
          if (!this.user || !this.newMessage.trim()) return;
          this.submitting = true;

          const { error } = await supabase
            .from('guestbook_entries')
            .insert({
              pet_id: this.petId,
              author_id: this.user.id,
              author_name: this.profile?.display_name || '익명',
              message: this.newMessage.trim()
            });

          if (error) {
            console.error(error);
            alert('방명록 등록에 실패했습니다.');
          } else {
            this.newMessage = '';
            await this.loadGuestbook();
          }
          this.submitting = false;
        },

        async deleteGuestbook(id) {
          if (!confirm('이 방명록을 삭제하시겠습니까?')) return;

          const { error } = await supabase
            .from('guestbook_entries')
            .delete()
            .eq('id', id);

          if (error) {
            alert('삭제에 실패했습니다.');
          } else {
            await this.loadGuestbook();
          }
        },

        login() { signInWithGoogle(); },
        async logout() { await signOut(); },

        formatDate,
        formatDateTime(dateStr) {
          if (!dateStr) return '';
          const d = new Date(dateStr);
          return d.toLocaleDateString('ko-KR') + ' ' + d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        }
      }
    }
  </script>
</body>
</html>
