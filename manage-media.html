<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사진/영상 관리 - 별빛추모</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sky: { 50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7' }
          }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { background: linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 50%, #fefce8 100%); min-height: 100vh; }
  </style>
</head>
<body class="font-sans text-slate-700" x-data="mediaPage()" x-init="init()" x-cloak>

  <header class="bg-white/80 backdrop-blur-md border-b border-sky-100 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a :href="`create-pet.html?id=${petId}`" class="flex items-center gap-2 text-sky-600">
        <span>←</span>
        <span class="font-medium">추모관 관리</span>
      </a>
      <span class="text-sm text-slate-500">사진/영상 관리</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    
    <div class="bg-white rounded-2xl border border-sky-50 p-5 mb-6">
      <div class="flex justify-between items-center mb-2">
        <span class="text-sm font-medium text-slate-600">사용 중인 용량</span>
        <span class="text-sm text-sky-600 font-medium" x-text="`${formatFileSize(usedStorage)} / ${formatFileSize(maxStorage)}`"></span>
      </div>
      <div class="w-full bg-sky-50 rounded-full h-2.5">
        <div 
          class="bg-sky-500 h-2.5 rounded-full transition-all"
          :style="`width: ${Math.min(100, (usedStorage / maxStorage) * 100)}%`"
        ></div>
      </div>
      <p class="text-xs text-slate-400 mt-2" x-show="usedStorage >= maxStorage">
        용량이 가득 찼습니다. <a href="plan.html" class="text-sky-500 underline">별빛 플러스</a>로 업그레이드 하세요.
      </p>
    </div>

    <div class="bg-white rounded-2xl border border-sky-50 p-5 mb-8">
      <h2 class="font-bold text-sky-700 mb-3">새 사진/영상 올리기</h2>
      <input 
        type="file" 
        accept="image/*,video/*" 
        multiple
        @change="onFilesSelected"
        :disabled="uploading || usedStorage >= maxStorage"
        class="text-sm"
      >
      <p class="text-xs text-slate-400 mt-2">이미지와 동영상을 선택할 수 있습니다. (여러 개 가능)</p>
      
      <div x-show="uploading" class="mt-3 text-sm text-sky-600">
        업로드 중... <span x-text="uploadProgress"></span>
      </div>
    </div>

    <h2 class="text-lg font-bold text-sky-700 mb-4">등록된 미디어 (<span x-text="mediaList.length"></span>)</h2>
    
    <div x-show="mediaList.length === 0" class="text-center py-12 text-slate-400 bg-white rounded-2xl border border-sky-50">
      아직 올린 사진/영상이 없습니다.
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
      <template x-for="media in mediaList" :key="media.id">
        <div class="relative group bg-white rounded-xl overflow-hidden border border-sky-50">
          <div class="aspect-square bg-sky-50">
            <template x-if="media.media_type === 'image'">
              <img :src="media.url" class="w-full h-full object-cover">
            </template>
            <template x-if="media.media_type === 'video'">
              <video :src="media.url" class="w-full h-full object-cover"></video>
            </template>
          </div>
          <div class="p-2">
            <p class="text-xs text-slate-500 truncate" x-text="media.file_name"></p>
            <p class="text-xs text-slate-400" x-text="formatFileSize(media.file_size)"></p>
          </div>
          <button 
            @click="deleteMedia(media)"
            class="absolute top-2 right-2 bg-red-500 text-white w-7 h-7 rounded-full text-sm opacity-0 group-hover:opacity-100 transition flex items-center justify-center"
          >
            ✕
          </button>
        </div>
      </template>
    </div>
  </main>

  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script>
    function mediaPage() {
      return {
        user: null,
        profile: null,
        petId: null,
        mediaList: [],
        usedStorage: 0,
        maxStorage: PLAN_LIMITS.free.maxStorage,
        uploading: false,
        uploadProgress: '',

        async init() {
          this.user = await getCurrentUser();
          if (!this.user) {
            alert('로그인이 필요합니다.');
            window.location.href = 'index.html';
            return;
          }
          this.profile = await getOrCreateProfile(this.user);
          this.maxStorage = PLAN_LIMITS[this.profile?.plan || 'free'].maxStorage;

          const params = new URLSearchParams(window.location.search);
          this.petId = params.get('id');
          if (!this.petId) {
            window.location.href = 'my-pets.html';
            return;
          }

          const { data: pet } = await supabase
            .from('pets')
            .select('owner_id')
            .eq('id', this.petId)
            .single();

          if (!pet || pet.owner_id !== this.user.id) {
            alert('권한이 없습니다.');
            window.location.href = 'my-pets.html';
            return;
          }

          await this.loadMedia();
          await this.calcStorage();
        },

        async loadMedia() {
          const { data, error } = await supabase
            .from('pet_media')
            .select('*')
            .eq('pet_id', this.petId)
            .order('sort_order', { ascending: true })
            .order('created_at', { ascending: true });

          if (!error && data) {
            this.mediaList = data.map(m => ({
              ...m,
              url: getPublicUrl(m.storage_path)
            }));
          }
        },

        async calcStorage() {
          const { data } = await supabase
            .from('pet_media')
            .select('file_size')
            .eq('owner_id', this.user.id);

          this.usedStorage = (data || []).reduce((sum, m) => sum + (m.file_size || 0), 0);
        },

        async onFilesSelected(e) {
          const files = Array.from(e.target.files || []);
          if (files.length === 0) return;

          const totalNewSize = files.reduce((sum, f) => sum + f.size, 0);
          if (this.usedStorage + totalNewSize > this.maxStorage) {
            alert('용량이 부족합니다. 별빛 플러스로 업그레이드 하거나 파일을 줄여주세요.');
            e.target.value = '';
            return;
          }

          this.uploading = true;
          let done = 0;

          for (const file of files) {
            this.uploadProgress = `${done + 1} / ${files.length}`;
            
            try {
              const isVideo = file.type.startsWith('video/');
              const ext = file.name.split('.').pop();
              const fileName = `${this.user.id}/${this.petId}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;

              const { error: uploadError } = await supabase.storage
                .from('pet-media')
                .upload(fileName, file);

              if (uploadError) throw uploadError;

              const { error: dbError } = await supabase
                .from('pet_media')
                .insert({
                  pet_id: this.petId,
                  owner_id: this.user.id,
                  storage_path: fileName,
                  media_type: isVideo ? 'video' : 'image',
                  file_name: file.name,
                  file_size: file.size,
                  sort_order: this.mediaList.length + done
                });

              if (dbError) throw dbError;
              done++;
            } catch (err) {
              console.error(err);
              alert(`${file.name} 업로드 실패: ${err.message}`);
            }
          }

          this.uploading = false;
          this.uploadProgress = '';
          e.target.value = '';
          await this.loadMedia();
          await this.calcStorage();
        },

        async deleteMedia(media) {
          if (!confirm('이 파일을 삭제하시겠습니까?')) return;

          await supabase.storage.from('pet-media').remove([media.storage_path]);

          const { error } = await supabase
            .from('pet_media')
            .delete()
            .eq('id', media.id);

          if (error) {
            alert('삭제에 실패했습니다.');
          } else {
            await this.loadMedia();
            await this.calcStorage();
          }
        },

        formatFileSize
      }
    }
  </script>
</body>
</html>
