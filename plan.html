<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>요금제 - 별빛추모</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sky: { 50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7' }
          }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { background: linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 50%, #fefce8 100%); min-height: 100vh; }
  </style>
</head>
<body class="font-sans text-slate-700" x-data="planPage()" x-init="init()" x-cloak>

  <header class="bg-white/80 backdrop-blur-md border-b border-sky-100 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="text-2xl">✨</span>
        <span class="text-xl font-bold text-sky-600">별빛추모</span>
      </a>
      <a href="my-pets.html" class="text-sm text-sky-600 hover:underline">내 추모관</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-12">
    <h1 class="text-3xl font-bold text-center text-sky-700 mb-2">요금제 안내</h1>
    <p class="text-center text-slate-500 mb-12">현재 요금제: <span class="font-medium text-sky-600" x-text="currentPlanLabel"></span></p>

    <div class="grid md:grid-cols-2 gap-6 max-w-3xl mx-auto">
      
      <!-- 별빛 무료 -->
      <div class="bg-white rounded-3xl border-2 border-sky-100 p-8 relative">
        <div class="text-center mb-6">
          <div class="text-4xl mb-2">⭐</div>
          <h2 class="text-xl font-bold text-slate-800">별빛 무료</h2>
          <p class="text-3xl font-bold text-sky-600 mt-2">0원</p>
        </div>
        <ul class="space-y-3 text-sm text-slate-600 mb-8">
          <li class="flex items-center gap-2">✓ 추모관 1개</li>
          <li class="flex items-center gap-2">✓ 사진+영상 1GB</li>
          <li class="flex items-center gap-2">✓ 방명록 기능</li>
          <li class="flex items-center gap-2">✓ 이름 검색</li>
        </ul>
        <div class="text-center">
          <span x-show="profile?.plan === 'free'" class="inline-block bg-sky-100 text-sky-700 px-4 py-2 rounded-full text-sm font-medium">
            현재 이용 중
          </span>
        </div>
      </div>

      <!-- 별빛 플러스 -->
      <div class="bg-white rounded-3xl border-2 border-sky-400 p-8 relative shadow-lg">
        <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-sky-500 text-white text-xs px-3 py-1 rounded-full">
          추천
        </div>
        <div class="text-center mb-6">
          <div class="text-4xl mb-2">✨</div>
          <h2 class="text-xl font-bold text-slate-800">별빛 플러스</h2>
          <p class="text-3xl font-bold text-sky-600 mt-2">39,000원 <span class="text-base font-normal text-slate-400">/ 년</span></p>
        </div>
        <ul class="space-y-3 text-sm text-slate-600 mb-8">
          <li class="flex items-center gap-2">✓ 추모관 최대 10개</li>
          <li class="flex items-center gap-2">✓ 사진+영상 20GB</li>
          <li class="flex items-center gap-2">✓ 방명록 기능</li>
          <li class="flex items-center gap-2">✓ 이름 검색</li>
          <li class="flex items-center gap-2">✓ 더 많은 추억을 담을 수 있어요</li>
        </ul>
        <div class="text-center">
          <template x-if="profile?.plan === 'plus'">
            <span class="inline-block bg-sky-100 text-sky-700 px-4 py-2 rounded-full text-sm font-medium">
              현재 이용 중
            </span>
          </template>
          <template x-if="profile?.plan !== 'plus'">
            <button 
              @click="upgrade"
              class="w-full bg-sky-500 text-white py-3 rounded-xl font-medium hover:bg-sky-600 transition"
            >
              업그레이드 하기
            </button>
          </template>
        </div>
      </div>
    </div>

    <p class="text-center text-sm text-slate-400 mt-10">
      ※ 현재 결제 시스템은 준비 중입니다.<br>
      업그레이드를 원하시면 관리자에게 문의해 주세요.
    </p>
  </main>

  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script>
    function planPage() {
      return {
        user: null,
        profile: null,

        get currentPlanLabel() {
          return PLAN_LIMITS[this.profile?.plan || 'free']?.label || '별빛 무료';
        },

        async init() {
          this.user = await getCurrentUser();
          if (this.user) {
            this.profile = await getOrCreateProfile(this.user);
          }
        },

        upgrade() {
          alert('결제 시스템은 현재 준비 중입니다.\n빠른 시일 내에 오픈할 예정입니다.');
        }
      }
    }
  </script>
</body>
</html>
